<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fun Story Game!</title>
    <!-- Load the stories from the separate file -->
    <script src="stories.js"></script>
    <style>
        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --bg-color: #F7FFF7;
            --text-color: #292F36;
            --accent-color: #FFE66D;
            --selected-color: #95E1D3; 
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-shadow: 2px 2px 0px var(--accent-color);
            margin-bottom: 5px;
        }

        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .scene-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 3px solid var(--secondary-color);
            transition: transform 0.3s ease;
        }

        .illustration {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        .story-text {
            font-size: 1.2rem;
            line-height: 1.4;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        /* --- GAMEPLAY HIGHLIGHT STYLE --- */
        .reading-highlight {
            background-color: #ffe57f !important; /* Bright Yellow-Gold */
            border-color: #ffc107 !important;     /* Darker Orange-Gold Border */
            border-width: 4px !important;         /* Thick Border */
            transform: scale(1.05);               /* Make it pop out */
            box-shadow: 0 10px 20px rgba(0,0,0,0.2) !important; /* Lift it up */
            font-weight: bold;
            z-index: 10;
            color: black !important;
        }

        /* --- FINAL STORY HIGHLIGHT STYLE (No scaling to prevent jumps) --- */
        .final-highlight {
            background-color: #ffe57f;
            border-radius: 5px;
            box-shadow: 0 0 5px #ffc107;
            padding: 2px 5px;
            transition: background-color 0.2s;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        button.choice-btn {
            background-color: white;
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--primary-color);
            text-align: left;
            display: flex;
            align-items: center;
            position: relative;
        }

        button.choice-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        
        button.choice-btn.selected-choice {
            background-color: var(--selected-color);
            border-color: #2F9E8E;
            box-shadow: none;
            transform: translateY(4px);
            font-weight: bold;
        }

        button.choice-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        button.choice-btn .emoji-icon {
            font-size: 1.4rem;
            margin-right: 10px;
            min-width: 30px;
        }

        /* --- CUSTOM INPUT STYLES --- */
        .custom-input-wrapper {
            display: flex;
            width: 100%;
            gap: 8px;
        }
        
        .custom-input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }

        .custom-input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 5px var(--secondary-color);
        }

        .custom-go-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #3AAFA9;
            transition: transform 0.1s;
        }

        .custom-go-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .speaking-indicator {
            font-size: 0.8rem;
            color: var(--secondary-color);
            height: 20px;
            margin-bottom: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .speaking-indicator.active {
            opacity: 1;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .hidden { display: none; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

    </style>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <h1 id="main-title">📚 Fun Story Game</h1>

    <div id="game-container">
        
        <!-- Story Selection Screen -->
        <div id="selection-screen" class="scene-card">
            <span class="illustration">🤔</span>
            <p class="story-text">Which story do you want to play?</p>
            <div class="choices-grid" id="story-menu">
                <!-- Buttons will be generated here -->
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="scene-card hidden">
            <span class="illustration" id="story-start-icon">🎒</span>
            <p class="story-text" id="story-start-text">Ready to start?</p>
            <p style="font-size: 0.9rem; color: #666;">Turn up your volume! 🔊</p>
            <!-- Added ID 'start-btn' for easier targeting -->
            <button id="start-btn" class="choice-btn" onclick="startSceneSequence()" style="justify-content: center; background: var(--secondary-color); border-color: #3AAFA9; box-shadow: 0 4px 0 #3AAFA9; color: white; font-weight: bold;">
                Start Adventure! 🚀
            </button>
            <br>
            <button class="choice-btn" onclick="showSelectionScreen()" style="justify-content: center; font-size: 0.9rem;">
                🔙 Back to Menu
            </button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="scene-card hidden">
            <span id="scene-emoji" class="illustration">🤔</span>
            <div id="speaking-status" class="speaking-indicator">🗣️ Reading options...</div>
            <p id="scene-text" class="story-text"></p>
            <div id="choices-container" class="choices-grid"></div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="scene-card hidden">
            <span class="illustration">🎉</span>
            <h2>The End!</h2>
            <div id="final-story" style="text-align: left; background: #FFFbea; padding: 15px; border-radius: 10px; margin-bottom: 15px; max-height: 300px; overflow-y: auto; font-size: 1rem;"></div>
            <button class="choice-btn" onclick="readFullStory()" style="justify-content: center; background: var(--accent-color); border-color: #E6C229; box-shadow: 0 4px 0 #E6C229; margin-bottom: 10px;">
                📖 Read Whole Story
            </button>
            <button class="choice-btn" onclick="showSelectionScreen()" style="justify-content: center;">
                🔄 Play Another Story
            </button>
        </div>
    </div>

    <script>
        // --- Game State ---
        let currentStoryScenes = [];
        let currentScene = 0;
        let userChoices = [];
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let currentUtterance = null;

        // Variables for final reading
        let readingIndex = 0;
        let readingType = 'q'; 

        // --- Init ---
        window.onload = function() {
            generateStoryMenu();
        };

        function generateStoryMenu() {
            const menu = document.getElementById('story-menu');
            menu.innerHTML = '';
            
            if (typeof gameStories === 'undefined') {
                menu.innerHTML = '<p style="color:red">Error: stories.js not loaded!</p>';
                return;
            }

            for (let key in gameStories) {
                const story = gameStories[key];
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span class="emoji-icon">${story.emoji}</span> ${story.title}`;
                btn.onclick = () => selectStory(key);
                menu.appendChild(btn);
            }
        }

        function showSelectionScreen() {
            cleanupHighlights(); 
            synth.cancel();

            // 1. Reset Menu Buttons
            const menuBtns = document.querySelectorAll('#story-menu .choice-btn');
            menuBtns.forEach(b => b.disabled = false);

            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('main-title').innerText = "📚 Fun Story Game";
        }

        function selectStory(storyKey) {
            const story = gameStories[storyKey];
            currentStoryScenes = story.scenes;
            
            // 1. Update Text
            document.getElementById('main-title').innerText = story.title;
            document.getElementById('story-start-icon').innerText = story.emoji;
            document.getElementById('story-start-text').innerText = `Ready to play "${story.title}"?`;
            
            // 2. IMPORTANT: Force enable the Start Button
            const startBtn = document.getElementById('start-btn');
            if(startBtn) startBtn.disabled = false;
            
            // 3. Show Screen
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            // 4. Reset State
            currentScene = 0;
            userChoices = [];
        }

        // --- Audio Setup ---
        function loadVoice() {
            let voices = synth.getVoices();
            selectedVoice = voices.find(voice => voice.name.includes('Samantha')) || 
                            voices.find(voice => voice.lang === 'en-US' && !voice.name.includes('Google')) || 
                            voices.find(voice => voice.lang === 'en-US') || 
                            voices[0];
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoice;
        }

        function speak(text, onEnd = null, onStart = null) {
            let utterThis = new SpeechSynthesisUtterance(text);
            utterThis.rate = 0.9; 
            utterThis.pitch = 1.05;
            if (selectedVoice) utterThis.voice = selectedVoice;
            
            if (onStart) utterThis.onstart = onStart;
            
            utterThis.onend = function(event) {
                if (onEnd) onEnd();
            };
            
            utterThis.onerror = function(event) {
                if (onEnd) onEnd();
            };

            currentUtterance = utterThis;
            synth.speak(utterThis);
        }

        function cleanupHighlights() {
            const highlighted = document.querySelectorAll('.reading-highlight, .final-highlight');
            highlighted.forEach(el => {
                el.classList.remove('reading-highlight');
                el.classList.remove('final-highlight');
            });
        }

        // --- Game Logic ---

        function startSceneSequence() {
            loadVoice();
            // Disable start button to prevent double-click
            document.getElementById('start-btn').disabled = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            loadScene();
        }

        function loadScene() {
            if (currentScene >= currentStoryScenes.length) {
                endGame();
                return;
            }

            const scene = currentStoryScenes[currentScene];
            
            // 1. Update UI
            document.getElementById('scene-emoji').innerText = scene.emoji;
            const textElement = document.getElementById('scene-text');
            textElement.innerText = scene.text;
            document.getElementById('speaking-status').classList.add('active');
            
            let progress = ((currentScene) / currentStoryScenes.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            // 2. Generate Choices
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            let buttonElements = []; 
            
            // A. Standard Choices
            scene.choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span class="emoji-icon">${choice.icon}</span> ${choice.text}`;
                btn.onclick = (e) => handleChoiceSelection(btn, choice.text);
                choicesContainer.appendChild(btn);
                buttonElements.push(btn);
            });

            // B. Write Your Own Option
            const customBtn = document.createElement('button');
            customBtn.className = 'choice-btn';
            customBtn.id = 'custom-choice-btn';
            customBtn.innerHTML = `<span class="emoji-icon">✍️</span> Write your own...`;
            customBtn.onclick = (e) => enableCustomInput(customBtn);
            choicesContainer.appendChild(customBtn);
            buttonElements.push(customBtn);

            // 3. Queue Audio
            synth.cancel(); 
            
            // Speak Main Question
            speak(
                scene.text, 
                () => textElement.classList.remove('reading-highlight'), 
                () => textElement.classList.add('reading-highlight')     
            );
            
            // Speak Choices
            scene.choices.forEach((choice, index) => {
                speak(
                    choice.text,
                    () => buttonElements[index].classList.remove('reading-highlight'),
                    () => buttonElements[index].classList.add('reading-highlight')
                );
            });

            // Speak "Or write your own"
            const customIndex = buttonElements.length - 1;
            speak(
                "Or... create your own answer!",
                () => buttonElements[customIndex].classList.remove('reading-highlight'),
                () => buttonElements[customIndex].classList.add('reading-highlight')
            );
        }

        // --- Custom Input Logic ---

        function enableCustomInput(btnElement) {
            synth.cancel();
            cleanupHighlights();
            document.getElementById('speaking-status').classList.remove('active');

            const wrapper = document.createElement('div');
            wrapper.className = 'custom-input-wrapper';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'custom-input';
            input.placeholder = 'Type your answer here...';
            input.id = 'custom-answer-input';
            
            input.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    submitCustomAnswer(input.value);
                }
            });

            const goBtn = document.createElement('button');
            goBtn.className = 'custom-go-btn';
            goBtn.innerText = 'GO!';
            goBtn.onclick = () => submitCustomAnswer(input.value);

            wrapper.appendChild(input);
            wrapper.appendChild(goBtn);
            
            btnElement.replaceWith(wrapper);
            input.focus();
        }

        function submitCustomAnswer(text) {
            if (!text || text.trim() === "") {
                speak("Please type something first!");
                return;
            }

            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);
            const goBtn = document.querySelector('.custom-go-btn');
            if(goBtn) goBtn.disabled = true;

            speak(text, function() {
                userChoices.push({
                    q: currentStoryScenes[currentScene].text,
                    a: text 
                });
                
                currentScene++;
                setTimeout(loadScene, 500); 
            });
        }


        // --- Standard Logic ---

        function handleChoiceSelection(btnElement, choiceText) {
            synth.cancel(); 
            cleanupHighlights();
            document.getElementById('speaking-status').classList.remove('active');

            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);
            const customBtn = document.getElementById('custom-choice-btn');
            if(customBtn) customBtn.disabled = true;

            btnElement.classList.add('selected-choice');

            speak(choiceText, function() {
                userChoices.push({
                    q: currentStoryScenes[currentScene].text,
                    a: choiceText
                });
                currentScene++;
                setTimeout(loadScene, 500); 
            });
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            
            const endButtons = document.querySelectorAll('#end-screen .choice-btn');
            endButtons.forEach(btn => btn.disabled = false);

            let storyHtml = "";
            
            // Build the HTML with IDs so we can highlight specific parts
            userChoices.forEach((item, index) => {
                storyHtml += `
                <div style="margin-bottom: 15px;">
                    <span id="final-q-${index}" class="final-text-segment">${item.q}</span><br>
                    <span id="final-a-${index}" class="final-text-segment" style="color:var(--primary-color); font-weight:bold;">👉 ${item.a}</span>
                </div>`;
            });

            document.getElementById('final-story').innerHTML = storyHtml;
            speak("You did it! What a funny story.");
        }

        // --- Start the Final Reading Chain ---
        function readFullStory() {
            synth.cancel();
            cleanupHighlights();
            readingIndex = 0;
            readingType = 'q'; 
            readNextSegment();
        }

        function readNextSegment() {
            if (readingIndex >= userChoices.length) {
                speak("The End!");
                return;
            }

            const item = userChoices[readingIndex];
            let textToSpeak, elementId;

            if (readingType === 'q') {
                textToSpeak = item.q;
                elementId = `final-q-${readingIndex}`;
            } else {
                textToSpeak = item.a;
                elementId = `final-a-${readingIndex}`;
            }

            const element = document.getElementById(elementId);
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            element.classList.add('final-highlight');

            speak(textToSpeak, () => {
                element.classList.remove('final-highlight');
                
                if (readingType === 'q') {
                    readingType = 'a'; 
                } else {
                    readingType = 'q'; 
                    readingIndex++;
                }
                
                readNextSegment();
            });
        }

    </script>
</body>
</html>
