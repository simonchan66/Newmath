<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fun Story Game!</title>
    <!-- Load the stories from the separate file -->
    <script src="stories.js"></script>
    <style>
        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --bg-color: #F7FFF7;
            --text-color: #292F36;
            --accent-color: #FFE66D;
            --selected-color: #95E1D3; 
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-shadow: 2px 2px 0px var(--accent-color);
            margin-bottom: 5px;
        }

        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .scene-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 3px solid var(--secondary-color);
            transition: transform 0.3s ease;
        }

        .illustration {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        .story-text {
            font-size: 1.2rem;
            line-height: 1.4;
            margin-bottom: 15px;
            min-height: 3rem; 
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        button.choice-btn {
            background-color: white;
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--primary-color);
            text-align: left;
            display: flex;
            align-items: center;
            position: relative;
        }

        button.choice-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        
        button.choice-btn.selected-choice {
            background-color: var(--selected-color);
            border-color: #2F9E8E;
            box-shadow: none;
            transform: translateY(4px);
            font-weight: bold;
        }

        button.choice-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        button.choice-btn .emoji-icon {
            font-size: 1.4rem;
            margin-right: 10px;
            min-width: 30px;
        }

        .speaking-indicator {
            font-size: 0.8rem;
            color: var(--secondary-color);
            height: 20px;
            margin-bottom: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .speaking-indicator.active {
            opacity: 1;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .hidden { display: none; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

    </style>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <h1 id="main-title">📚 Fun Story Game</h1>

    <div id="game-container">
        
        <!-- Story Selection Screen -->
        <div id="selection-screen" class="scene-card">
            <span class="illustration">🤔</span>
            <p class="story-text">Which story do you want to play?</p>
            <div class="choices-grid" id="story-menu">
                <!-- Buttons will be generated here -->
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="scene-card hidden">
            <span class="illustration" id="story-start-icon">🎒</span>
            <p class="story-text" id="story-start-text">Ready to start?</p>
            <p style="font-size: 0.9rem; color: #666;">Turn up your volume! 🔊</p>
            <button class="choice-btn" onclick="startSceneSequence()" style="justify-content: center; background: var(--secondary-color); border-color: #3AAFA9; box-shadow: 0 4px 0 #3AAFA9; color: white; font-weight: bold;">
                Start Adventure! 🚀
            </button>
            <br>
            <button class="choice-btn" onclick="showSelectionScreen()" style="justify-content: center; font-size: 0.9rem;">
                🔙 Back to Menu
            </button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="scene-card hidden">
            <span id="scene-emoji" class="illustration">🤔</span>
            <div id="speaking-status" class="speaking-indicator">🗣️ Reading options...</div>
            <p id="scene-text" class="story-text"></p>
            <div id="choices-container" class="choices-grid"></div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="scene-card hidden">
            <span class="illustration">🎉</span>
            <h2>The End!</h2>
            <div id="final-story" style="text-align: left; background: #FFFbea; padding: 15px; border-radius: 10px; margin-bottom: 15px; max-height: 300px; overflow-y: auto; font-size: 1rem;"></div>
            <button class="choice-btn" onclick="readFullStory()" style="justify-content: center; background: var(--accent-color); border-color: #E6C229; box-shadow: 0 4px 0 #E6C229; margin-bottom: 10px;">
                📖 Read Whole Story
            </button>
            <button class="choice-btn" onclick="showSelectionScreen()" style="justify-content: center;">
                🔄 Play Another Story
            </button>
        </div>
    </div>

    <script>
        // --- Game State ---
        let currentStoryScenes = []; // Will hold the selected story data
        let currentScene = 0;
        let userChoices = [];
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let currentUtterance = null;

        // --- Init ---
        window.onload = function() {
            generateStoryMenu();
        };

        function generateStoryMenu() {
            const menu = document.getElementById('story-menu');
            menu.innerHTML = '';
            
            // Loop through the stories in stories.js
            for (let key in gameStories) {
                const story = gameStories[key];
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span class="emoji-icon">${story.emoji}</span> ${story.title}`;
                btn.onclick = () => selectStory(key);
                menu.appendChild(btn);
            }
        }

        function showSelectionScreen() {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('main-title').innerText = "📚 Fun Story Game";
        }

        function selectStory(storyKey) {
            // Load the data
            const story = gameStories[storyKey];
            currentStoryScenes = story.scenes;
            
            // Update UI for Start Screen
            document.getElementById('main-title').innerText = story.title;
            document.getElementById('story-start-icon').innerText = story.emoji;
            document.getElementById('story-start-text').innerText = `Ready to play "${story.title}"?`;
            
            // Switch Screens
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            // Reset Game State
            currentScene = 0;
            userChoices = [];
        }

        // --- Audio Setup ---
        function loadVoice() {
            let voices = synth.getVoices();
            selectedVoice = voices.find(voice => voice.name.includes('Samantha')) || 
                            voices.find(voice => voice.lang === 'en-US') || 
                            voices[0];
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoice;
        }

        function speak(text, callback = null, rate = 0.95) {
            let utterThis = new SpeechSynthesisUtterance(text);
            utterThis.rate = rate; 
            utterThis.pitch = 1.05;
            if (selectedVoice) utterThis.voice = selectedVoice;
            
            if (callback) {
                utterThis.onend = callback;
                utterThis.onerror = callback;
            }
            currentUtterance = utterThis;
            synth.speak(utterThis);
        }

        // --- Game Logic ---

        function startSceneSequence() {
            loadVoice();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            loadScene();
        }

        function loadScene() {
            if (currentScene >= currentStoryScenes.length) {
                endGame();
                return;
            }

            const scene = currentStoryScenes[currentScene];
            
            // 1. Update UI
            document.getElementById('scene-emoji').innerText = scene.emoji;
            document.getElementById('scene-text').innerText = scene.text;
            document.getElementById('speaking-status').classList.add('active');
            
            let progress = ((currentScene) / currentStoryScenes.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            // 2. Generate Choices
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            scene.choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span class="emoji-icon">${choice.icon}</span> ${choice.text}`;
                btn.onclick = (e) => handleChoiceSelection(btn, choice.text);
                choicesContainer.appendChild(btn);
            });

            // 3. Auto-Read
            synth.cancel(); 
            speak(scene.text);
            scene.choices.forEach(choice => {
                speak(choice.text);
            });
        }

        function handleChoiceSelection(btnElement, choiceText) {
            synth.cancel();
            document.getElementById('speaking-status').classList.remove('active');

            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);

            btnElement.classList.add('selected-choice');

            speak(choiceText, function() {
                userChoices.push({
                    q: currentStoryScenes[currentScene].text,
                    a: choiceText
                });
                currentScene++;
                setTimeout(loadScene, 500); 
            });
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            
            const endButtons = document.querySelectorAll('#end-screen .choice-btn');
            endButtons.forEach(btn => btn.disabled = false);

            let storyHtml = "";
            let storyReadText = "Here is your story. ";
            
            userChoices.forEach((item, index) => {
                storyHtml += `<p style="margin-bottom:10px;"><strong>${index + 1}.</strong> ${item.q}<br><span style="color:var(--primary-color)">👉 ${item.a}</span></p>`;
                storyReadText += `${item.q} ${item.a}. `;
            });

            document.getElementById('final-story').innerHTML = storyHtml;
            document.getElementById('final-story').dataset.readText = storyReadText;
            
            speak("You did it! What a funny story.");
        }

        function readFullStory() {
            const text = document.getElementById('final-story').dataset.readText;
            synth.cancel();
            speak(text, null, 1.0);
        }

    </script>
</body>
</html>
